name: Build and Push OpenJ9 Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 使用 GitHub CLI 自动检索并下载该 Release 下所有的 jar 文件，无视具体文件名
      - name: Download Release Jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v3.2.32 --repo wushuo894/ani-rss --pattern "*.jar" --clobber
          # 重命名为固定的 app.jar 供 Dockerfile 读取
          mv *.jar app.jar
          ls -lh app.jar

      - name: Resolve lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 升级至 v6 适配 GitHub Actions 最新 Node 运行环境
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:3.2.32-openj9
            ${{ env.IMAGE_NAME }}:openj9
